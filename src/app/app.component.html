<router-outlet #outlet="outlet"></router-outlet>

<div class="toast toast-top mt-12 mr-4 fixed z-50" *ngIf="notifications$ | async as notifications">
  @for (notification of (notifications$ | async); track $index) {
  <div [@fadeInOut] [ngClass]="{
        'alert-success': notification.style === 'success',
        'alert-error': notification.style === 'error',
        'alert-info': notification.style === 'info'
      }" class="mb-2 alert relative shadow-lg">
    @if(notification.style === 'success') {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    } @else if(notification.style === 'error') {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    } @else if(notification.style === 'info') {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    }
    <span [innerHTML]="notification.message"></span>

    <button (click)="removeNotification($index)" class="cursor-pointer">
      <div [ngClass]="{
        'bg-emerald-400': notification.style === 'success',
        'bg-rose-400': notification.style === 'error',
        'bg-sky-400': notification.style === 'info'
      }" class="radial-progress text-primary-content shadow-md absolute" [ngStyle]="{
        '--value': notification.percent,
        '--size': '1.5rem',
        'top': '-6px',
        'right': '-6px'
      }" role="progressbar">
        x
      </div>
    </button>
  </div>
  }
</div>
